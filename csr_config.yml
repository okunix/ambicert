csrOutputFile: "cert.csr"
keyOutputFile: "cert.key"
key:
  algorithm: rsa
  rsaBitDepth: 2048
  # mldsaParameter: 87
  # ellipticCurve: P521

template:
  signatureAlgorithm: SHA256WithRSA

  subject:
    commonName: "example.com"
    country: ["RU"]
    organization: ["My Mega Company"]
    OrganizationalUnit: ["IT Department", "Security Team"]
    locality: ["Moscow"]
    province: ["Moscow Region"]
    streetAddress: ["Red Square, 1"]
    postalCode: ["101000"]
    serialNumber: "001-2023"

  dnsNames:
    - "example.com"
    - "www.example.com"
    - "api.example.com"
    - "*.example.com"
  emailAddresses:
    - "admin@example.com"
    - "devops@example.com"
  ipAddresses:
    - "127.0.0.1"
    - "192.168.1.50"
  uris:
    - "https://google.com"

  keyUsage:
    critical: true
    values:
      - digitalSignature
      - keyEnchiperment
  extendedKeyUsage:
    critical: true
    values:
      - clientAuth
  basicConstraints:
    isCA: false
    critical: false
    maxPathLen: 10
