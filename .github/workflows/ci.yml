name: BUILD

on:
  push:
    branches: [main, feature-parser]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build on GO ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: make

      - name: Test with file
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out priv.key -outform PEM
          ./bin/ambicert --csr-config csr_config.yml > my_site.csr

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ambicert-binaries
          path: |
            bin/ambicert
            my_site.csr
            priv.key
