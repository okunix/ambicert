name: BUILD

on:
  push:
    branches: [main, feature-parser]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build on GO ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Get dependencies
        run: go mod tidy

      - name: Build
        run: go build -v -o bin/ambicert ./...
